name: fieldgpslog
description: "A professional GPS tracking and distance logging app for delivery professionals."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management & Navigation
  get: ^4.6.6

  # Maps & Location
  google_maps_flutter: ^2.6.1
  google_maps_flutter_android: ^2.10.0
  google_maps_flutter_platform_interface: ^2.6.0
  activity_recognition_flutter: ^6.0.0
  geolocator: ^11.0.0
  location: ^5.0.3
  permission_handler: ^11.3.1
  
  # Persistence & Offline Storage (Migrated to Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  
  # Background Execution
  flutter_background_service: ^5.0.7
  flutter_local_notifications: ^17.1.2
  
  # UI & Design
  google_fonts: ^6.2.1
  intl: ^0.19.0
  font_awesome_flutter: ^10.7.0
  lottie: ^3.1.2
  flutter_native_splash: ^2.4.4
  
  # PDF & Reporting
  pdf: ^3.10.10
  printing: ^5.11.1
  http: ^1.6.0
  share_plus: ^10.1.0
  
  # Media & Input (New for Commercial Upgrade)
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  signature: ^5.5.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter_native_splash:
  color: "#ffffff"
  android_12:
    color: "#ffffff"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/config/
