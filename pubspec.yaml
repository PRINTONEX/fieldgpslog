name: fieldgpslog
description: "A professional GPS tracking and distance logging app for delivery professionals."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management & Navigation
  get: ^4.6.6
  
  # Maps & Location
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0
  location: ^5.0.3
  
  # Persistence & Offline Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  
  # Background Execution
  flutter_background_service: ^5.0.7
  flutter_local_notifications: ^17.1.2
  
  # UI & Design
  google_fonts: ^6.2.1
  intl: ^0.19.0
  font_awesome_flutter: ^10.7.0
  flutter_riverpod:
  # PDF & Reporting
  pdf: ^3.10.10
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/config/
